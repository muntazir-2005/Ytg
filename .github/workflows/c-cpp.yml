name: Build Non-JB Tweak Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:      # يسمح لك بتشغيله يدوياً من تبويب Actions

jobs:
  build:
    runs-on: macos-13     # أحدث بيئة macOS مستقرة تحتوي على Xcode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          # التأكد من توفر أدوات سطر الأوامر
          if ! xcode-select -p &> /dev/null; then
            echo "Xcode CLI tools مفقودة، جاري التثبيت..."
            sudo xcode-select --install || true
          fi
          
          # تثبيت ldid لتوقيع الـ dylib
          if ! command -v ldid &> /dev/null; then
            echo "ldid غير موجود، جاري التثبيت..."
            brew install ldid
          fi

      - name: Verify dependencies
        run: |
          # التأكد من وجود المكتبات المطلوبة
          if [ ! -f libs/libdobby.a ]; then
            echo "خطأ: الملف libs/libdobby.a غير موجود في المشروع!"
            exit 1
          fi
          echo "جميع الملفات الأساسية موجودة."

      - name: Build tweak
        run: |
          cd $GITHUB_WORKSPACE
          make clean
          make
          # عرض الملف الناتج للتأكيد
          ls -la MyTweak.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTweak-dylib
          path: MyTweak.dylib
          if-no-files-found: error   # يفشل إذا لم يتم العثور على الملف
