name: Build Non-JB Dylib (Real Dobby)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ldid

      - name: Build real libdobby.a from source (iOS arm64)
        run: |
          # 1. استنساخ Dobby
          git clone --depth 1 https://github.com/jmpews/Dobby.git
          cd Dobby

          # 2. تحديد SDK
          export SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          # 3. توليد مشروع Xcode
          mkdir build && cd build
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=$SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=$(xcrun --sdk iphoneos -f clang) \
            -DCMAKE_CXX_COMPILER=$(xcrun --sdk iphoneos -f clang++) \
            -DBUILD_TESTING=OFF

          # 4. بناء المكتبة الثابتة
          xcodebuild -project Dobby.xcodeproj \
            -scheme dobby_static \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO

          # 5. نسخ المكتبة من المسار الصحيح (build/Release/libdobby.a)
          cp build/Release/libdobby.a ../../libdobby.a
          cd ../..

          echo "تم بناء libdobby.a الحقيقية بنجاح."
          file libdobby.a

      - name: Build dylib
        run: make

      - name: Prepare artifacts
        run: |
          mkdir -p output
          cp MyTweak.dylib output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NonJB-Dylib-Real
          path: output/
          retention-days: 7
