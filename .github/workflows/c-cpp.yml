name: Build iOS Dylib (Theos Workflow)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء (Build Type)'
        required: true
        default: 'release'
        type: choice
        options:
        - release
        - debug

# تحديد الصلاحيات كأفضل ممارسة أمنية
permissions:
  contents: read

jobs:
  build:
    name: Build Dynamic Library (.dylib)
    runs-on: macos-14

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # تحديد إصدار Xcode لضمان استقرار البناء
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: 2. Cache Theos and SDKs
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/theos
            ${{ github.workspace }}/theos/sdks
          key: ${{ runner.os }}-theos-v2-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-theos-v2-

      - name: 3. Setup Theos Environment
        run: |
          if [ ! -d "$THEOS" ]; then
            echo "Cloning Theos repository..."
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          else
            echo "Theos already exists from cache."
          fi

      - name: 4. Download iOS SDKs
        run: |
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ] && [ ! -d "$THEOS/sdks/iPhoneOS14.5.sdk" ]; then
            echo "Downloading iOS SDKs..."
            git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
            mkdir -p "$THEOS/sdks"
            cp -r /tmp/sdks/*.sdk "$THEOS/sdks/" 2>/dev/null || true
            rm -rf /tmp/sdks
          else
            echo "SDKs already cached."
          fi

      - name: Install Latest ldid
        run: |
          brew install ldid

      - name: 5. Compile Dynamic Library (.dylib)
        run: |
          echo "Cleaning existing build files..."
          make clean
          
          echo "Starting compilation process..."
          # استخدام inputs مباشرة. إذا كان فارغاً (في حالة Push)، سيعتبره release
          BUILD_TYPE="${{ inputs.build_type }}"
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            make DEBUG=1
          else
            make FINALPACKAGE=1
          fi

      - name: 6. Organize Build Artifacts
        run: |
          mkdir -p output
          # البحث الشامل والنسخ لتفادي أي تغييرات في الـ Makefile
          find .theos/obj/ -name "*.dylib" -exec cp {} output/ \; 2>/dev/null || true
          find packages/ -name "*.deb" -exec cp {} output/ \; 2>/dev/null || true
          
          echo "Output files ready:"
          ls -la output/

      - name: 7. Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Dylib-Artifacts
          path: output/
          retention-days: 7
          if-no-files-found: error # سيفشل الإجراء إذا لم يتم العثور على ملفات للرفع
