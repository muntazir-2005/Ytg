name: Build Non-JB Dylib (Real Dobby)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build real libdobby.a from source
        run: |
          # 1. استنساخ مستودع Dobby الرسمي
          git clone --depth 1 https://github.com/jmpews/Dobby.git
          cd Dobby

          # 2. بناء المكتبة الثابتة (dobby_static) لنظام iOS arm64
          xcodebuild -project Dobby.xcodeproj \
            -scheme dobby_static \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

          # 3. نسخ المكتبة الناتجة إلى جذر المشروع
          cp build/Build/Products/Release-iphoneos/libdobby.a ../libdobby.a
          cd ..

          # 4. التأكد من وجودها
          file libdobby.a
          echo "تم بناء libdobby.a الحقيقية بنجاح."

      - name: Build dylib
        run: make

      - name: Prepare artifacts
        run: |
          mkdir -p output
          cp MyTweak.dylib output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NonJB-Dylib-Real
          path: output/
          retention-days: 7
