name: Build Non-JB Dylib (Real Dobby)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ldid

      - name: Build real libdobby.a from source
        run: |
          # 1. استنساخ مستودع Dobby الرسمي
          git clone --depth 1 https://github.com/jmpews/Dobby.git
          cd Dobby

          # 2. إعداد البناء لنظام iOS arm64
          mkdir build && cd build
          cmake .. \
            -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=../cmake/ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=12.0 \
            -DCMAKE_BUILD_TYPE=Release

          # 3. بناء الهدف dobby_static
          make dobby_static -j$(sysctl -n hw.ncpu)

          # 4. نسخ المكتبة إلى جذر المشروع
          cp libdobby.a ../../libdobby.a
          cd ../..

          # 5. التأكد
          file libdobby.a
          echo "تم بناء libdobby.a الحقيقية بنجاح."

      - name: Build dylib
        run: make

      - name: Prepare artifacts
        run: |
          mkdir -p output
          cp MyTweak.dylib output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NonJB-Dylib-Real
          path: output/
          retention-days: 7
