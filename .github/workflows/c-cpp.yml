name: Build Non-JB Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: macos-14

    steps:
      # 1. سحب الكود
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت أداة التوقيع ldid
      - name: Install ldid
        run: brew install ldid

      # 3. التحقق من وجود المكتبات المطلوبة (dobby)
      - name: Verify required libraries
        run: |
          if [ ! -f libs/libdobby.a ]; then
            echo "خطأ: ملف libs/libdobby.a غير موجود في المشروع"
            exit 1
          fi
          echo "جميع الملفات الأساسية موجودة."

      # 4. بناء الـ dylib باستخدام Makefile المخصص
      - name: Build dylib
        run: |
          make clean
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            make DEBUG=1
          else
            make
          fi

      # 5. تجهيز المخرجات
      - name: Prepare artifacts
        run: |
          mkdir -p output
          if [ -f MyTweak.dylib ]; then
            cp MyTweak.dylib output/
          else
            echo "خطأ: الملف MyTweak.dylib لم يتم العثور عليه"
            exit 1
          fi
          echo "الملفات الناتجة:"
          ls -la output/

      # 6. رفع الملف الناتج كـ artifact
      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: NonJB-Dylib
          path: output/
          retention-days: 7
