name: Build Non-JB Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Ensure libdobby.a (download or create stub)
        run: |
          # محاولة التحميل مع إضافة -f ليفشل صراحة إذا كان الرابط معطوب
          curl -sfL -o libdobby.a "https://raw.githubusercontent.com/jmpews/DobbyX/master/libs/libdobby.a" || true

          # التأكد من أن الملف موجود وأنه أرشيف برمجي صالح وليس صفحة HTML
          if [ ! -f libdobby.a ] || ! file libdobby.a | grep -q "archive"; then
            echo "التحميل فشل أو الرابط معطوب، سيتم إنشاء مكتبة وهمية (C++ Stub)..."
            rm -f libdobby.a
            
            # إنشاء ملف C++ Stub باستخدام echo لتجنب مشاكل المسافات مع EOF في YAML
            echo '#include <stdint.h>' > dobby_stub.cpp
            echo '#include <stdbool.h>' >> dobby_stub.cpp
            echo 'typedef struct { uint64_t hook_vaddr; uint64_t hook_size; uint64_t code_vaddr; uint64_t code_size; uint64_t patched_vaddr; uint64_t original_vaddr; uint64_t instrument_vaddr; uint64_t patch_size; uint64_t patch_hash; void *target_replace; void *instrument_handler; } StaticInlineHookBlock;' >> dobby_stub.cpp
            echo 'int dobby_create_instrument_bridge(void *targetData) { return 0; }' >> dobby_stub.cpp
            echo 'bool dobby_static_inline_hook(StaticInlineHookBlock *hookBlock, StaticInlineHookBlock *hookBlockRVA, uint64_t funcRVA, void *funcData, uint64_t targetRVA, void *targetData, uint64_t InstrumentBridgeRVA, void *patchBytes, int patchSize) { return false; }' >> dobby_stub.cpp
            
            # البناء باستخدام clang++
            clang++ -arch arm64 -c dobby_stub.cpp -o dobby_stub.o
            ar rcs libdobby.a dobby_stub.o
          else
            echo "تم العثور على libdobby.a الأصلية وصالحة للاستخدام."
          fi

      - name: Build dylib
        run: make

      - name: Prepare artifacts
        run: |
          mkdir -p output
          cp MyTweak.dylib output/

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: NonJB-Dylib
          path: output/
          retention-days: 7
