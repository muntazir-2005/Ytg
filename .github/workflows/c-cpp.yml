name: Build Non-JB Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Verify required library
        run: |
          if [ ! -f libdobby.a ]; then
            echo "خطأ: libdobby.a غير موجود في جذر المستودع"
            exit 1
          fi
          echo "المكتبة موجودة."

      - name: Build dylib
        run: |
          make clean
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            make DEBUG=1
          else
            make
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p output
          if [ -f MyTweak.dylib ]; then
            cp MyTweak.dylib output/
          else
            echo "خطأ: MyTweak.dylib لم يتم إنشاؤه"
            exit 1
          fi
          echo "الملفات الناتجة:"
          ls -la output/

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: NonJB-Dylib
          path: output/
          retention-days: 7
