name: Build iOS Dylib (Pro Workflow)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Clean Dylib
    runs-on: macos-14

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Cache Theos and SDKs
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/theos
            ${{ github.workspace }}/theos/sdks
          key: ${{ runner.os }}-theos-v3-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-theos-v3-

      - name: Setup Theos
        run: |
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          fi

      - name: Setup iOS SDKs
        run: |
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
            mkdir -p "$THEOS/sdks"
            cp -r /tmp/sdks/*.sdk "$THEOS/sdks/" 2>/dev/null || true
            rm -rf /tmp/sdks
          fi

      # تم إضافة هذه الخطوة لحل مشكلة ldid: command not found
      - name: Install ldid
        run: brew install ldid

      - name: Compile Dylib
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Organize Artifacts
        run: |
          mkdir -p output
          find .theos/obj/ -name "*.dylib" -exec cp {} output/ \; 2>/dev/null || true

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Clean-MyTweak-Dylib
          path: output/
          retention-days: 7
          if-no-files-found: error
