name: Build Non-JB Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ldid

      - name: Clone and build Dobby from source
        run: |
          git clone https://github.com/jmpews/Dobby.git
          cd Dobby
          mkdir build && cd build
          cmake .. \
            -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=../cmake/ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=12.0 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --target dobby_static -j$(sysctl -n hw.ncpu)
          # المكتبة موجودة في build/libdobby.a
          cp libdobby.a ../../libdobby.a
          cd ../..

      - name: Build dylib
        run: make

      - name: Prepare artifacts
        run: |
          mkdir -p output
          cp MyTweak.dylib output/

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: NonJB-Dylib
          path: output/
          retention-days: 7
