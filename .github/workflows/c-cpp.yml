name: Build Non-JB Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build dylib
        run: make

      - name: Prepare artifacts
        run: |
          mkdir -p output
          cp MyTweak.dylib output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NonJB-Dylib
          path: output/
          retention-days: 7
