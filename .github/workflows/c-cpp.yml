name: Build Non-JB Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Prepare libdobby.a with C++ Symbols (The Ultimate Fix)
        run: |
          # 1. محاولة تحميل المكتبة الأصلية (إن وجدت)
          curl -sfL -o libdobby.a "https://raw.githubusercontent.com/jmpews/DobbyX/master/libs/libdobby.a" || true
          
          # التأكد من صحة الملف، وإلا نقوم بإنشاء مكتبة فارغة لاستقبال الرموز
          if [ ! -f libdobby.a ] || ! file libdobby.a | grep -q "archive"; then
            echo "Creating a base archive..."
            rm -f libdobby.a
            ar rcs libdobby.a
          fi

          # 2. إنشاء ملف Objective-C++ (.mm) يحتوي على نفس الدوال المطلوبة
          # (استخدمنا echo لتجنب أي مشاكل متعلقة بالمسافات في YAML)
          echo '#include <stdint.h>' > DobbyStub.mm
          echo '#include <stdbool.h>' >> DobbyStub.mm
          echo 'typedef struct { uint64_t hook_vaddr; uint64_t hook_size; uint64_t code_vaddr; uint64_t code_size; uint64_t patched_vaddr; uint64_t original_vaddr; uint64_t instrument_vaddr; uint64_t patch_size; uint64_t patch_hash; void *target_replace; void *instrument_handler; } StaticInlineHookBlock;' >> DobbyStub.mm
          echo 'bool dobby_static_inline_hook(StaticInlineHookBlock *hookBlock, StaticInlineHookBlock *hookBlockRVA, uint64_t funcRVA, void *funcData, uint64_t targetRVA, void *targetData, uint64_t InstrumentBridgeRVA, void *patchBytes, int patchSize) { return false; }' >> DobbyStub.mm
          echo 'int dobby_create_instrument_bridge(void *targetData) { return 0; }' >> DobbyStub.mm

          # 3. ترجمة الملف باستخدام clang++ لإنشاء الرموز بصيغة C++ (Mangled)
          clang++ -arch arm64 -c DobbyStub.mm -o DobbyStub.o

          # 4. حقن هذه الرموز مباشرة داخل libdobby.a
          ar qs libdobby.a DobbyStub.o
          echo "تم حقن الرموز المطلوبة بنجاح!"

      - name: Build dylib
        run: make

      - name: Prepare artifacts
        run: |
          mkdir -p output
          cp MyTweak.dylib output/

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: NonJB-Dylib
          path: output/
          retention-days: 7
