name: Build Non-JB Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Get libdobby.a (try curl)
        run: |
          curl -L -o libdobby.a https://raw.githubusercontent.com/jmpews/DobbyX/master/libs/libdobby.a || echo "Download failed"
        continue-on-error: true

      - name: Fallback to stub if libdobby.a missing
        run: |
          if [ ! -f libdobby.a ]; then
            echo "Download failed, creating stub library..."
            cat > dobby_stub.c << 'EOF'
            #include <stdint.h>
            typedef struct {
              uint64_t hook_vaddr;
              uint64_t hook_size;
              uint64_t code_vaddr;
              uint64_t code_size;
              uint64_t patched_vaddr;
              uint64_t original_vaddr;
              uint64_t instrument_vaddr;
              uint64_t patch_size;
              uint64_t patch_hash;
              void *target_replace;
              void *instrument_handler;
            } StaticInlineHookBlock;

            int dobby_create_instrument_bridge(void *targetData) {
                return 0;
            }

            bool dobby_static_inline_hook(StaticInlineHookBlock *hookBlock, StaticInlineHookBlock *hookBlockRVA, uint64_t funcRVA,
                                          void *funcData, uint64_t targetRVA, void *targetData, uint64_t InstrumentBridgeRVA,
                                          void *patchBytes, int patchSize) {
                return false;
            }
            EOF
            clang -arch arm64 -c dobby_stub.c -o dobby_stub.o
            ar rcs libdobby.a dobby_stub.o
          fi

      - name: Build dylib
        run: make

      - name: Prepare artifacts
        run: |
          mkdir -p output
          cp MyTweak.dylib output/

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: NonJB-Dylib
          path: output/
          retention-days: 7
